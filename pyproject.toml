[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-trading-intelligence"
version = "0.1.0"
description = "Offline-first market research and simulation-only paper trading toolkit"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iti = "iti.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
